appId: ${BARESYNC_ANDROID_APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ready"
    timeout: 30000
- assertVisible: "${BARESYNC_FIXTURE_ENCODING}"
- assertVisible: "DB Path"
- assertVisible: "Dirty Rows"
- assertVisible: "Migration Count"
- assertVisible: "Needs Baseline"
- tapOn:
    id: "baseline-sync"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: ".*cat:Drinks.*"
    timeout: 30000
- assertVisible: ".*prod:Kopi Susu.*"
- tapOn:
    id: "create-row"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: ".*cat:Fixture Category 001.*"
    timeout: 30000
- assertVisible: ".*prod:Fixture Product 001.*"
- tapOn:
    id: "manual-sync"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: '.*"mode":"(push_only|full_sync)".*'
    timeout: 30000
- assertVisible: '.*"mode":"(push_only|full_sync)".*'
- extendedWaitUntil:
    visible: ".*cat:local-cat-001:synced.*"
    timeout: 30000
- assertVisible: ".*prod:local-prod-001:synced.*"

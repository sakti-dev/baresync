[package]
name = "__PROJECT_NAME__-app"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-baresync = "0.2.0"
env_logger = "0.11"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[workspace]

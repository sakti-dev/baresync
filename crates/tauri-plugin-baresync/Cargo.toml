[package]
name = "tauri-plugin-baresync"
version = "0.1.0"
edition = "2021"
description = "Tauri plugin wrapper for Baresync"
license = "MIT"
repository = "https://github.com/sakti-dev/baresync.git"
readme = "README.md"
keywords = ["tauri", "sqlite", "sync"]
categories = ["api-bindings", "database"]

[features]
default = []
sqlcipher = ["baresync-core/sqlcipher"]

[dependencies]
tauri = { version = "2", features = [] }
baresync-core = { version = "0.1.0", path = "../baresync-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

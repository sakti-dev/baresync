[package]
name = "tauri-plugin-baresync"
version = "0.3.1"
edition = "2021"
links = "tauri-plugin-baresync"
description = "Tauri plugin wrapper for Baresync"
license = "MIT"
repository = "https://github.com/sakti-dev/baresync.git"
readme = "README.md"
keywords = ["tauri", "sqlite", "sync"]
categories = ["api-bindings", "database"]

[features]
default = []
sqlcipher = ["baresync-core/sqlcipher"]

[dependencies]
tauri = { version = "2", features = [] }
baresync-core = { version = "0.3.1", path = "../baresync-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[build-dependencies]
tauri-plugin = { version = "2.5", features = ["build"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
